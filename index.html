<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b"><title>Mister Burguer — A qualidade faz a diferença</title>
<style>
:root{--bg:#0b0b0b;--cd:#151515;--ln:#2a2a2a;--tx:#fff;--mu:#a8a8a8;--or:#ff7a00}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",sans-serif;padding-bottom:90px}
.top{background:radial-gradient(circle at 50% 0,#5a2a00,#0b0b0b 70%);padding:18px 14px 16px;text-align:center}
.logo{font:900 34px/1 Impact,"Arial Black",sans-serif;color:var(--or);letter-spacing:.02em}.logo b{display:block;color:#fff}
.bn{display:grid;grid-template-columns:38% 1fr;max-width:640px;margin:0 auto;border-radius:20px;overflow:hidden;text-align:left;background:linear-gradient(135deg,#343434,#1b1b1b);border:1px solid #444;box-shadow:0 14px 40px #000a}.bn-ph{background:url(/img/banner-burger.jpg) center/cover;min-height:210px}.bn-tx{padding:12px 12px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}.bn-logo{width:100%;height:auto;max-width:210px}.bn-l{color:#fff;font-weight:700;font-size:13px}.bn-a{color:var(--or);font-weight:800;font-size:11px;text-transform:uppercase;line-height:1.25}
.top img.logo-img{display:block;width:min(220px,60vw);height:auto;margin:0 auto;border-radius:22px;box-shadow:0 0 40px #ff7a0033}.sl{font-style:italic;color:#e8d3bd;margin-top:8px}
.st{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px}.st.on{background:#12351c;color:#6dff9a}.st.off{background:#3a1212;color:#ff8d8d}
.w{max-width:720px;margin:0 auto;padding:0 14px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln)}
.tabs a{white-space:nowrap;padding:8px 14px;border:1px solid var(--ln);border-radius:99px;color:#fff;text-decoration:none;font-size:14px}
input,select,textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid var(--ln);border-radius:12px;padding:13px;font:inherit;margin:4px 0 10px}
h2{margin:22px 0 8px;font-size:22px}
.p{display:flex;gap:12px;align-items:flex-start;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.pt{flex:1;min-width:0}.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.ft .pr{margin:0}img.pi{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:none}.p small{color:var(--mu);display:block;margin-top:4px}.pr{color:var(--or);font-weight:800;margin-top:6px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:var(--or);color:#000;cursor:pointer;min-height:46px}
button.s{background:transparent;color:#fff;border:1px solid var(--ln)}button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center;background:var(--or);color:#000;border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 10px 30px #000a;cursor:pointer;border:0;width:calc(100% - 20px)}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#111;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.q{display:flex;align-items:center;gap:10px}.q button{padding:4px 12px;min-height:36px}
label.k{display:flex;gap:10px;align-items:center;margin:6px 0}label.k input{width:auto;margin:0}
.err{background:#3a1212;color:#ffb0b0;padding:10px;border-radius:10px;margin:8px 0}.m{color:var(--mu);font-size:14px}
.sk{height:84px;border-radius:16px;margin:10px 0;background:linear-gradient(90deg,#151515,#222,#151515);background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header class="top" id="top"><div class="bn"><div class="bn-ph" role="img" aria-label="Hambúrguer Mister Burguer"></div><div class="bn-tx"><img class="bn-logo" src="/img/logo-t.png" alt="Mister Burguer — A qualidade faz a diferença" width="260" height="250"><div class="bn-l" id="bi">@misterburguer.cg.ofc</div><div class="bn-l" id="bp">(67) 99155-3835</div><div class="bn-a" id="ba"></div></div></div><span class="st" id="st"></span><p class="m" id="eta"></p></header>
<div id="tabs" class="tabs"></div>
<main class="w" id="menu"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div id="layer"></div>
<script>
const $=q=>document.querySelector(q),R=n=>'R$ '+Number(n).toFixed(2).replace('.',','),E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let M,cart=[];try{cart=JSON.parse(localStorage.mbcart||'[]')}catch{}
const save=()=>localStorage.mbcart=JSON.stringify(cart),count=()=>cart.reduce((s,i)=>s+i.qty,0);
async function load(){try{M=await(await fetch('/api/menu')).json()}catch{$('#menu').innerHTML='<div class="err">Não foi possível carregar o cardápio. Verifique sua conexão e tente novamente.</div>';return}
 const s=M.store;document.title=s.store_name+' — '+s.slogan;const w=s.whatsapp.replace(/^55/,'');$('#bi').textContent=s.instagram;$('#bp').textContent='📞 ('+w.slice(0,2)+') '+w.slice(2,7)+'-'+w.slice(7);$('#ba').textContent=s.address.split(' — ')[0];$('#st').className='st '+(M.open?'on':'off');$('#st').textContent=M.open?'🟢 ABERTO AGORA':'🔴 FECHADO';$('#eta').textContent=M.open?'Previsão de entrega: '+s.eta:'Pedidos disponíveis no horário de funcionamento';
 $('#tabs').innerHTML=M.categories.map(c=>`<a href="#c${c.id}">${E(c.name)}</a>`).join('');
 $('#menu').innerHTML=`<input id="q" type="search" placeholder="Buscar no cardápio" aria-label="Buscar no cardápio" oninput="filt(this.value)" style="margin-top:14px">`+M.categories.map(c=>`<section id="c${c.id}"><h2>${E(c.name)}</h2>${c.products.map(p=>`<div class="p" data-n="${E((p.name+' '+p.descr).toLowerCase())}"><div class="pt"><b>${E(p.name)}</b><small>${E(p.descr)}</small><div class="ft"><span class="pr">${R(p.price)}</span><button onclick="add(${p.id})" ${M.open?'':'disabled'} aria-label="Adicionar ${E(p.name)}">Adicionar</button></div></div>${p.img?`<img class="pi" src="${E(p.img)}" alt="${E(p.name)}" loading="lazy">`:''}</div>`).join('')}</section>`).join('');bar()}
function filt(v){v=v.toLowerCase();document.querySelectorAll('.p').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')}
const prod=id=>M.categories.flatMap(c=>c.products).find(p=>p.id==id);
function add(id){const p=prod(id);layer(`<h2 style="margin-top:0">${E(p.name)}</h2><p class="m">${E(p.descr)}</p><b>Adicionais</b>${M.addons.map(a=>`<label class="k"><input type="checkbox" value="${a.id}"> ${E(a.name)} <span class="m">+ ${R(a.price)}</span></label>`).join('')}<label>Observação</label><input id="no" maxlength="120" placeholder="Ex.: sem cebola, molho separado"><div class="r" style="border:0"><button class="s" onclick="layer()">Cancelar</button><button onclick="put(${id})">Adicionar ao carrinho</button></div>`)}
function put(id){const ad=[...document.querySelectorAll('.sheet input[type=checkbox]:checked')].map(i=>+i.value),n=$('#no').value;const k=id+'|'+ad.join()+'|'+n,f=cart.find(i=>i.k==k);f?f.qty++:cart.push({k,id,addons:ad,note:n,qty:1});save();layer();bar()}
function unit(i){return prod(i.id).price+i.addons.reduce((s,a)=>s+(M.addons.find(x=>x.id==a)?.price||0),0)}
const sub=()=>cart.reduce((s,i)=>s+unit(i)*i.qty,0);
function bar(){cart=cart.filter(i=>prod(i.id));save();const b=$('#bar');b&&b.remove();if(!count())return;document.body.insertAdjacentHTML('beforeend',`<button class="bar" id="bar" onclick="cartView()"><span>🛒 ${count()} ${count()>1?'itens':'item'}</span><span>Ver carrinho · ${R(sub())}</span></button>`)}
function layer(h){$('#layer').innerHTML=h?`<div class="sheet" onclick="if(event.target==this)layer()"><div role="dialog" aria-modal="true">${h}</div></div>`:''}
function cartView(){layer(`<h2 style="margin-top:0">Seu pedido</h2>${cart.map((i,x)=>`<div class="r"><div><b>${E(prod(i.id).name)}</b>${i.addons.map(a=>`<div class="m">+ ${E(M.addons.find(z=>z.id==a)?.name)}</div>`).join('')}${i.note?`<div class="m">Obs: ${E(i.note)}</div>`:''}</div><div class="q"><button class="s" onclick="qty(${x},-1)" aria-label="Diminuir">−</button>${i.qty}<button class="s" onclick="qty(${x},1)" aria-label="Aumentar">+</button></div></div>`).join('')}<div class="r"><b>Subtotal</b><b>${R(sub())}</b></div><div class="r" style="border:0"><button class="s" onclick="layer()">Continuar pedindo</button><button onclick="checkout()">Finalizar</button></div>`)}
function qty(x,d){cart[x].qty+=d;if(cart[x].qty<1)cart.splice(x,1);save();bar();count()?cartView():layer()}
function checkout(){layer(`<h2 style="margin-top:0">Finalizar pedido</h2><label>Como você quer receber?</label><select id="ty" onchange="ty()"><option value="delivery">Delivery</option><option value="pickup">Retirada no balcão</option><option value="table">Mesa</option></select>
<label for="nm">Nome</label><input id="nm" autocomplete="name"><label for="ph">WhatsApp (com DDD)</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel">
<div id="dl"><label>Rua</label><input id="st1"><label>Número</label><input id="nu" inputmode="numeric"><label>Bairro</label><input id="bo"><label>Complemento (opcional)</label><input id="co"><label>Ponto de referência</label><input id="rf"></div>
<div id="tb" hidden><label>Número da mesa</label><input id="mesa" inputmode="numeric"></div>
<label>Pagamento</label><select id="pay" onchange="py()"><option value="PIX">PIX</option><option value="DINHEIRO">Dinheiro</option><option value="DEBITO">Cartão de débito</option><option value="CREDITO">Cartão de crédito</option></select>
<div id="tr" hidden><label>Precisa de troco?</label><select id="tq" onchange="$('#tv').hidden=this.value!='s'"><option value="n">Não</option><option value="s">Sim</option></select><div id="tv" hidden><label>Troco para quanto?</label><input id="tc" inputmode="decimal"></div></div>
<label>Observações do pedido</label><textarea id="ob" rows="2" maxlength="300"></textarea>
<div class="r"><b>Subtotal</b><b>${R(sub())}</b></div><p class="m">A taxa de entrega é confirmada pelo restaurante conforme a distância do endereço.</p><div id="er"></div>
<div class="r" style="border:0"><button class="s" onclick="cartView()">Voltar</button><button id="go" onclick="send()">Enviar pedido</button></div>`)}
const ty=()=>{const t=$('#ty').value;$('#dl').hidden=t!='delivery';$('#tb').hidden=t!='table'},py=()=>$('#tr').hidden=$('#pay').value!='DINHEIRO';
async function send(){const g=$('#go');g.disabled=true;g.textContent='Enviando…';$('#er').innerHTML='';
 const t=$('#ty').value,b={type:t,name:$('#nm').value,phone:$('#ph').value,pay:$('#pay').value,notes:$('#ob').value,table:$('#mesa').value,
  change:$('#pay').value=='DINHEIRO'&&$('#tq').value=='s'?+$('#tc').value.replace(',','.'):null,
  addr:t=='delivery'?{street:$('#st1').value,number:$('#nu').value,hood:$('#bo').value,comp:$('#co').value,ref:$('#rf').value}:null,
  items:cart.map(i=>({id:i.id,qty:i.qty,addons:i.addons,note:i.note}))};
 try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),o=await r.json();
  if(!r.ok)throw o.error;cart=[];save();bar();done(o,b)}catch(e){$('#er').innerHTML=`<div class="err">${E(typeof e=='string'?e:'Não foi possível enviar. Tente novamente.')}</div>`;g.disabled=false;g.textContent='Enviar pedido'}}
function done(o,b){const L=['*'+M.store.store_name+' — Pedido '+o.number+'*','Cliente: '+b.name,...o.items.map(i=>`${i.qty}x ${i.name}`+i.addons.map(a=>'\n   + '+a.name).join('')+(i.note?'\n   Obs: '+i.note:'')),'Subtotal: '+R(o.subtotal),'Total: '+R(o.total),'Modalidade: '+({delivery:'Delivery',pickup:'Retirada',table:'Mesa '+b.table})[b.type],'Pagamento: '+b.pay];
 layer(`<h2 style="margin-top:0">Pedido ${o.number} enviado ✅</h2><p>Recebemos seu pedido. Previsão: ${E(o.eta)}.</p><div class="r"><b>Total</b><b>${R(o.total)}</b></div><p class="m">Toque abaixo para enviar a confirmação pelo WhatsApp.</p><a href="https://wa.me/${M.store.whatsapp}?text=${encodeURIComponent(L.join('\n'))}" target="_blank" rel="noopener"><button style="width:100%">Enviar pelo WhatsApp</button></a><button class="s" style="width:100%;margin-top:10px" onclick="layer()">Fechar</button>`)}
load();
</script></body></html>
